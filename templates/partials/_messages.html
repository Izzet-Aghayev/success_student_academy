{% if messages %}
  <div class="container px-3 px-sm-4 px-md-5 px-lg-4 px-xl-5 px-xxl-5 pt-3 pt-sm-4 pt-md-4 pt-lg-4 pt-xl-4 pt-xxl-4">
    {% for message in messages %}
      <div class="alert alert-{{ message.tags }} alert-dismissible fade show rounded-4 shadow-soft mb-3" role="alert">
        <div class="d-flex align-items-start gap-2">
          <div>
            {% if message.level == DEFAULT_MESSAGE_LEVELS.SUCCESS %}✅{% elif message.level == DEFAULT_MESSAGE_LEVELS.ERROR %}⚠️{% elif message.level == DEFAULT_MESSAGE_LEVELS.WARNING %}⚠️{% else %}ℹ️{% endif %}
          </div>
          <div class="flex-grow-1">
            {{ message }}
          </div>
          <button type="button" class="btn-close p-2" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
      </div>
    {% endfor %}
  </div>
{% endif %}
